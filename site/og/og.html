<!doctype html>
<!-- Source for ../og.png (1200x630). Render: see README.txt next to this file -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fastlight OG image</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=JetBrains+Mono:wght@500&family=Sora:wght@600;700&display=block">
<style>
  html, body { margin: 0; }
  body { width: var(--w, 1200px); height: var(--h, 630px); overflow: hidden; background: #15161B; position: relative; font-family: Inter, sans-serif; color: #F5F3EE; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(55% 70% at 78% 60%, rgba(255,92,154,.38), rgba(123,92,255,.16) 45%, transparent 75%),
      radial-gradient(35% 40% at 8% 0%, rgba(255,154,61,.14), transparent 70%); }
  .copy { position: absolute; left: 72px; top: 72px; width: 470px; }
  .lockup { height: 56px; display: block; }
  h1 { font: 700 54px/1.06 Sora, sans-serif; letter-spacing: -0.025em; margin: 64px 0 0; }
  .meta { position: absolute; left: 72px; bottom: 64px; display: flex; gap: 12px; align-items: center; font-size: 20px; color: #A3A5B3; }
  kbd { font: 500 19px/1 "JetBrains Mono", monospace; color: #F5F3EE; background: #2A2B33; border: 1px solid #0D0E12; border-bottom-width: 3px; border-radius: 8px; padding: 7px 11px 6px; }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #5C5E6B; }
  .shot { position: absolute; left: calc(var(--w, 1200px) - 610px); top: 92px; width: 760px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 40px 90px -30px rgba(0,0,0,.85), 0 40px 120px -50px rgba(255,92,154,.6); }
  .shot img { display: block; width: 100%; }
  /* GitHub social preview variant: og.html?size=github (1280x640) */
  .github { --w: 1280px; --h: 640px; }
  .github .copy { left: 84px; width: 520px; }
  .github .meta { left: 84px; }
  .github h1 { font-size: 58px; }
</style>
<script>if (new URLSearchParams(location.search).get('size') === 'github') document.documentElement.className = 'github';</script>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <img class="lockup" src="../brand/logo-lockup-dark.svg" alt="Fastlight">
    <h1>Find anything on your Mac in a millisecond.</h1>
  </div>
  <div class="meta"><kbd>⌥Space</kbd><span>Free</span><span class="dot"></span><span>Open source</span><span class="dot"></span><span>macOS 14+</span></div>
  <div class="shot"><img src="../assets/hero-apps-1536.webp" alt=""></div>
</body>
</html>
