# Keeps the bundled fsearch current: weekly, when upstream's main has moved
# past the pinned commit, scripts/bump-fsearch.sh updates the submodule and
# bumps the patch version, and this opens (or refreshes) one PR for it.
# Merging that PR releases the new version (see tag-release.yml).
#
# The PR branch is only ever rewritten while it holds nothing but this
# workflow's own commit, and only when it's stale: upstream moved past its
# pin, or main's version moved so its bump would be wrong. A branch that
# merely lags behind main is left alone. Once someone else has pushed to it,
# the workflow never force-pushes: it comments on the PR instead.
#
# PRs opened with the workflow token don't trigger other workflows, so CI is
# started on the branch explicitly; its result shows on the PR. Needs
# "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.
name: fsearch

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: fsearch-update
  cancel-in-progress: false

jobs:
  update:
    # macOS for PlistBuddy, as the release does.
    runs-on: macos-26
    env:
      BRANCH: deps/fsearch
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          # Nothing below needs them but the explicit fetch and push.
          persist-credentials: false

      - name: Update fsearch
        id: bump
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/bump-fsearch.sh

      - name: Open or update the PR
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
          NOTES: ${{ steps.bump.outputs.notes }}
        run: |
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          main="$(git rev-parse HEAD^)" # bump-fsearch.sh made one commit on main
          force=()
          if git fetch --quiet "$remote" "refs/heads/$BRANCH" 2>/dev/null; then
            branch="$(git rev-parse FETCH_HEAD)"
            pin="$(git ls-tree "$branch" third_party/fsearch | awk '{print $3}')"
            version="$(git show "$branch:Resources/Info.plist" | plutil -extract CFBundleShortVersionString raw -o - -)"
            # Same upstream commit and the same version: it only lacks main's
            # newer commits, which doesn't need a rewrite (nor a new CI run).
            if [ "$pin" = "$NEW" ] && [ "$version" = "$VERSION" ]; then
              echo "$BRANCH is already current"
              exit 0
            fi
            others="$(git log --format='%ae%n%ce' "$main..$branch" | grep -vxF "$bot" | sort -u || true)"
            if [ -n "$others" ]; then
              msg="fsearch is now at \`${NEW:0:7}\` (Fastlight $VERSION), but \`$BRANCH\` has commits by someone other than github-actions, so the fsearch workflow left it alone. Bring it up to date by hand, or delete the branch so the next run recreates it."
              echo "::warning::$msg"
              pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
              if [ -n "$pr" ]; then gh pr comment "$pr" --body "$msg"; fi
              exit 0
            fi
            # Only our own commit: replace it, unless it changed meanwhile.
            force=(--force-with-lease="refs/heads/$BRANCH:$branch")
          fi
          git push --quiet "${force[@]}" "$remote" "HEAD:refs/heads/$BRANCH"

          title="build(deps): update fsearch to ${NEW:0:7} (Fastlight $VERSION)"
          body="$RUNNER_TEMP/body.md"
          {
            echo "Updates the bundled [fsearch](https://github.com/noahdunnagan/fsearch) from \`${OLD:0:7}\` to \`${NEW:0:7}\` and bumps Fastlight to **$VERSION**."
            echo
            echo "## Upstream changes"
            echo
            cat "$NOTES"
            echo
            echo "[Full diff](https://github.com/noahdunnagan/fsearch/compare/$OLD...$NEW)"
            echo
            echo "Merging this releases Fastlight $VERSION: tag-release.yml tags it and runs the release build."
            echo
            echo "<sub>Opened by the weekly fsearch workflow. When upstream moves on (or main's version changes), it rewrites \`$BRANCH\`, unless someone else has pushed to it: then it leaves the branch alone and comments here.</sub>"
          } > "$body"

          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$title" --body-file "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$body"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
