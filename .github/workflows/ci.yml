name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The fsearch workflow starts it on its own PRs, which don't trigger it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/fsearch
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/fsearch/Cargo.lock') }}

      - name: Test
        run: make test

      - name: Build app
        run: make app

      - name: Verify signature
        run: codesign --verify --deep --strict build/Fastlight.app
