name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .build/fsearch
          key: cargo-${{ runner.os }}-${{ hashFiles('third_party/fsearch/Cargo.lock') }}

      - name: Test
        run: make test

      - name: Build app
        run: make app

      - name: Verify signature
        run: codesign --verify --deep --strict build/Fastlight.app
