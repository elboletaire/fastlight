# Builds a universal Fastlight.app, packs it into a DMG and attaches it to the
# GitHub Release for the pushed tag. A manual run from a branch only builds:
# the DMG is kept as the run's Fastlight-dmg artifact and no release is
# touched, so it can't overwrite a published DMG or leave a draft behind for
# the tag run to trip over.
#
# The build (which runs cargo build scripts, SwiftPM and dmgbuild from PyPI)
# gets a read-only token that isn't kept in .git/config; only the publish
# job, which runs nothing but gh, can write. The homebrew job then updates
# the cask in elboletaire/homebrew-tap (homebrew.yml), with its own token for
# that repository alone (HOMEBREW_TAP_TOKEN, optional).
#
# Ad-hoc signed by default. To ship a Developer ID signed and notarized DMG,
# add these repository secrets (signing and notarization are each skipped
# unless all of their secrets are set):
#
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   CODESIGN_IDENTITY           e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    env:
      UNIVERSAL: '1'
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' && secrets.CODESIGN_IDENTITY != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # The DMG is named after the bundle version, so a tag that doesn't
      # match it would publish, say, Fastlight-0.2.0.dmg as v0.3.0.
      - name: Check version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match Info.plist version $version"
            exit 1
          fi

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: make test

      # scripts/dmg.sh runs dmgbuild (pinned there) through uv to lay out the
      # DMG window; in CI it fails rather than ship a plain DMG.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build app and DMG
        env:
          CODESIGN_IDENTITY: ${{ env.HAS_SIGNING == 'true' && secrets.CODESIGN_IDENTITY || '-' }}
        run: |
          make dmg
          lipo -info build/Fastlight.app/Contents/MacOS/Fastlight build/Fastlight.app/Contents/Helpers/*
          codesign --verify --deep --strict build/Fastlight.app

      - name: Notarize
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="$(ls build/Fastlight-*.dmg)"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fastlight-dmg
          path: build/Fastlight-*.dmg
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Fastlight-dmg
          path: dist

      # A re-run for a published release replaces its DMG (same tag, same
      # commit). A draft with this tag is left over from something else and
      # might carry another build: refuse it rather than upload into it and
      # leave the release unpublished.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg="$(ls dist/Fastlight-*.dmg)"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" = true ]; then
              echo "::error::release $TAG is a draft; delete it (or publish it by hand) and re-run"
              exit 1
            fi
            gh release upload "$TAG" "$dmg" --clobber
          else
            gh release create "$TAG" "$dmg" --verify-tag --title "Fastlight ${TAG#v}" --generate-notes
          fi

  # The cask in elboletaire/homebrew-tap, pointed at the release just
  # published. See homebrew.yml, which can also be run on its own.
  homebrew:
    needs: publish
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
